name: Build Android ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up NDK
        run: |
          ANDROID_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER=$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          yes | $SDKMANAGER "ndk;27.0.12077973" > /dev/null 2>&1
          echo "ANDROID_NDK=$ANDROID_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Configure
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            ..

      - name: Build
        run: cmake --build build -j 4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwenGameServer-arm64
          path: build/libgameserver.so
